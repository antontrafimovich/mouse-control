<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mouse Control</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        align-items: center;
        background: Canvas;
        color: CanvasText;
        display: grid;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        margin: 0 auto;
        max-width: 420px;
        width: min(100%, 420px);
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.15;
        margin: 0 0 20px;
      }

      .controls {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      button {
        border: 1px solid ButtonBorder;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 52px;
        padding: 12px 16px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      #start {
        background: #176b4d;
        color: white;
      }

      #stop {
        background: #9f2d2d;
        color: white;
      }

      #status {
        margin: 16px 0 0;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mouse Control</h1>
      <div class="controls">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button">Stop</button>
      </div>
      <p id="status" role="status">Checking status...</p>
    </main>

    <script>
      const startButton = document.querySelector("#start");
      const stopButton = document.querySelector("#stop");
      const statusText = document.querySelector("#status");

      function renderStatus(running) {
        startButton.disabled = running;
        stopButton.disabled = !running;
        statusText.textContent = running ? "Running" : "Stopped";
      }

      async function requestJson(path, options = {}) {
        const response = await fetch(path, options);

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        return response.json();
      }

      async function refreshStatus() {
        try {
          const data = await requestJson("/status");
          renderStatus(data.running);
        } catch (err) {
          statusText.textContent = err.message;
        }
      }

      async function setRunning(path) {
        startButton.disabled = true;
        stopButton.disabled = true;

        try {
          const data = await requestJson(path, { method: "POST" });
          renderStatus(data.running);
        } catch (err) {
          statusText.textContent = err.message;
          await refreshStatus();
        }
      }

      startButton.addEventListener("click", () => setRunning("/start"));
      stopButton.addEventListener("click", () => setRunning("/stop"));

      refreshStatus();
    </script>
  </body>
</html>
